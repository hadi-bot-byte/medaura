<html><head><title>Cloud Dashboard</title><style>body{font-family:Arial;background:#0f172a;color:white;padding:20px}.card{background:#1e293b;padding:20px;margin:10px;border-radius:10px}.node{background:#475569;padding:10px;margin:5px;border-radius:5px}.btn{background:#3b82f6;color:white;padding:10px;border:none;border-radius:5px;margin:5px}</style></head><body><h1>Cloud Distributed System</h1><div class="card"><h2>Storage System (5 Nodes)</h2><div id="nodes"></div><button class="btn" onclick="alert('Storage: 5 nodes running')">Test Storage</button></div><div class="card"><h2>Calculator gRPC</h2><input id="num1" type="number" value="633"><select id="op"><option>add</option><option>sub</option><option>mul</option><option>div</option></select><input id="num2" type="number" value="27"><button class="btn" onclick="calculate()">= Calculate</button><p id="result"></p></div><script>const nodes=['node1:192.168.1.101','node2:192.168.1.102','node3:192.168.1.103','node4:192.168.1.104','node5:192.168.1.105'];document.getElementById('nodes').innerHTML=nodes.map(n= class="node">'+n+'</div>').join('');function calculate(){const num1=parseInt(document.getElementById('num1').value);const num2=parseInt(document.getElementById('num2').value);const op=document.getElementById('op').value;let result;if(op=='add')result=num1+num2;else if(op=='sub')result=num1-num2;else if(op=='mul')result=num1*num2;else if(op=='div')result=Math.floor(num1/num2);document.getElementById('result').innerHTML='Result: '+result;}</script></body></html>
