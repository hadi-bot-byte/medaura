<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDrive - Functional Distributed Storage</title>
    <style>
        /* [Keep all the CSS from previous version] */
        /* ... Same beautiful CSS ... */
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>🔐 CloudDrive Login</h2>
            <input type="text" class="login-input" id="username" placeholder="Username" value="admin">
            <input type="password" class="login-input" id="password" placeholder="Password" value="admin123">
            <button class="login-btn" onclick="login()">Login to CloudDrive</button>
            <div style="text-align: center; margin-top: 15px; color: #666; font-size: 14px;">
                <p>Demo: admin / admin123</p>
                <p>Real file upload/download with distribution</p>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard" id="dashboard">
        <!-- [Keep all HTML structure from previous version] -->
        <!-- ... Same beautiful HTML ... -->
    </div>

    <!-- File Upload Modal -->
    <div id="uploadModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 15px; width: 400px; text-align: center;">
            <h3 style="margin-bottom: 20px;">📤 Upload File</h3>
            <input type="file" id="fileInput" style="margin-bottom: 20px; width: 100%; padding: 10px;">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="document.getElementById('uploadModal').style.display='none'" style="padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 8px; cursor: pointer;">Cancel</button>
                <button onclick="handleFileUpload()" style="padding: 10px 20px; background: #4285f4; color: white; border: none; border-radius: 8px; cursor: pointer;">Upload & Distribute</button>
            </div>
            <div id="uploadProgress" style="margin-top: 20px; display: none;">
                <div style="background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden;">
                    <div id="progressBar" style="height: 100%; background: #10b981; width: 0%; transition: width 0.3s;"></div>
                </div>
                <div id="uploadStatus" style="margin-top: 10px; font-size: 14px;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api';
        
        // Login function
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadNodes();
                    loadFiles();
                    showNotification('Login successful! Connected to distributed storage.');
                } else {
                    alert('Login failed: ' + data.message);
                }
            } catch (error) {
                alert('Cannot connect to server. Make sure api.py is running on port 5001');
                console.error('Login error:', error);
            }
        }

        // Load storage nodes
        async function loadNodes() {
            try {
                const response = await fetch(`${API_URL}/nodes`);
                const nodes = await response.json();
                
                const nodeStatus = document.querySelector('.node-status');
                if (nodeStatus) {
                    nodeStatus.innerHTML = nodes.map(node => `
                        <div class="node-item">
                            <span>${node.id}</span>
                            <span class="node-${node.status}">● ${node.status}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading nodes:', error);
            }
        }

        // Load files from backend
        async function loadFiles() {
            try {
                const response = await fetch(`${API_URL}/files`);
                const files = await response.json();
                
                const fileGrid = document.getElementById('fileGrid');
                if (fileGrid) {
                    if (files.length === 0) {
                        fileGrid.innerHTML = `
                            <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #64748b;">
                                <div style="font-size: 48px; margin-bottom: 20px;">📁</div>
                                <h3>No files yet</h3>
                                <p>Upload your first file to distribute across storage nodes</p>
                                <button onclick="showUploadModal()" style="margin-top: 20px; padding: 10px 20px; background: #4285f4; color: white; border: none; border-radius: 8px; cursor: pointer;">
                                    Upload First File
                                </button>
                            </div>
                        `;
                    } else {
                        fileGrid.innerHTML = files.map(file => `
                            <div class="file-card" onclick="openFile('${file.id}')">
                                <div class="file-icon">${file.icon || '📄'}</div>
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${file.size_formatted || formatSize(file.size)}</div>
                                <div class="file-date">${file.upload_date || 'Recently'}</div>
                                <div style="font-size: 11px; color: #3b82f6; margin-top: 5px;">
                                    Distributed to ${file.nodes ? file.nodes.length : 3} nodes
                                </div>
                                <div style="margin-top: 10px; display: flex; gap: 5px; justify-content: center;">
                                    <button onclick="event.stopPropagation(); downloadFile('${file.id}')" style="padding: 5px 10px; background: #10b981; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer;">
                                        Download
                                    </button>
                                    <button onclick="event.stopPropagation(); deleteFile('${file.id}')" style="padding: 5px 10px; background: #ef4444; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer;">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Error loading files:', error);
                showNotification('Error loading files. Make sure backend is running.');
            }
        }

        // File upload functions
        function showUploadModal() {
            document.getElementById('uploadModal').style.display = 'flex';
            document.getElementById('uploadProgress').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }

        async function handleFileUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            document.getElementById('uploadProgress').style.display = 'block';
            document.getElementById('uploadStatus').textContent = 'Uploading...';
            
            // Simulate progress
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                document.getElementById('progressBar').style.width = `${Math.min(progress, 90)}%`;
                if (progress >= 90) clearInterval(interval);
            }, 200);
            
            try {
                const response = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                clearInterval(interval);
                document.getElementById('progressBar').style.width = '100%';
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('uploadStatus').textContent = 'Distributing across nodes...';
                    setTimeout(() => {
                        document.getElementById('uploadModal').style.display = 'none';
                        loadFiles();
                        showNotification(`✅ File "${file.name}" uploaded and distributed to ${result.nodes.length} nodes`);
                    }, 1000);
                } else {
                    document.getElementById('uploadStatus').textContent = 'Upload failed';
                    showNotification(`Upload failed: ${result.error}`);
                }
            } catch (error) {
                clearInterval(interval);
                document.getElementById('uploadStatus').textContent = 'Upload error';
                showNotification('Upload failed. Check server connection.');
                console.error('Upload error:', error);
            }
        }

        // File operations
        async function downloadFile(fileId) {
            try {
                window.open(`${API_URL}/download/${fileId}`, '_blank');
                showNotification('Download started');
            } catch (error) {
                showNotification('Download failed');
                console.error('Download error:', error);
            }
        }

        async function deleteFile(fileId) {
            if (!confirm('Are you sure you want to delete this file?')) return;
            
            try {
                const response = await fetch(`${API_URL}/delete/${fileId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('File deleted from all nodes');
                    loadFiles();
                } else {
                    showNotification('Delete failed: ' + result.error);
                }
            } catch (error) {
                showNotification('Delete failed');
                console.error('Delete error:', error);
            }
        }

        function openFile(fileId) {
            // In a real app, this would open/preview the file
            showNotification('File preview would open here');
        }

        // Calculator with real API
        async function calculate() {
            const num1 = parseInt(document.getElementById('calcNum1').value) || 0;
            const num2 = parseInt(document.getElementById('calcNum2').value) || 1;
            const op = document.getElementById('calcOperator').value;
            
            try {
                const response = await fetch(`${API_URL}/calculate`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        num1: num1,
                        num2: num2,
                        operation: op
                    })
                });
                
                const result = await response.json();
                
                document.getElementById('calcResult').innerHTML = `
                    <div>${result.num1} ${getOperatorSymbol(result.operation)} ${result.num2} =</div>
                    <div style="font-size: 28px; margin-top: 5px;">${result.result}</div>
                    <div style="font-size: 12px; margin-top: 10px; color: #047857;">
                        ✓ Calculated via API
                    </div>
                `;
                
                showNotification(`Calculation: ${result.result}`);
            } catch (error) {
                // Fallback to local calculation if API fails
                let localResult;
                switch(op) {
                    case 'add': localResult = num1 + num2; break;
                    case 'sub': localResult = num1 - num2; break;
                    case 'mul': localResult = num1 * num2; break;
                    case 'div': localResult = Math.floor(num1 / num2); break;
                    case 'mod': localResult = num1 % num2; break;
                }
                
                document.getElementById('calcResult').innerHTML = `
                    <div>${num1} ${getOperatorSymbol(op)} ${num2} =</div>
                    <div style="font-size: 28px; margin-top: 5px;">${localResult}</div>
                    <div style="font-size: 12px; margin-top: 10px; color: #ef4444;">
                        ⚠️ API offline, calculated locally
                    </div>
                `;
                
                showNotification('API offline, using local calculation');
            }
        }

        function getOperatorSymbol(op) {
            const symbols = { add: '+', sub: '-', mul: '×', div: '÷', mod: '%' };
            return symbols[op] || '+';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
        }

        // Notification system
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #10b981;
                color: white;
                padding: 15px 25px;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
            .node-online { color: #10b981; font-weight: bold; }
            .node-offline { color: #ef4444; font-weight: bold; }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
